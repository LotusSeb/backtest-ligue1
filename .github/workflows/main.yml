name: Backtest hebdomadaire

on:
  # Tous les lundis a 6h UTC
  schedule:
    - cron: "0 6 * * 1"
  # Permet aussi de le lancer manuellement depuis l'onglet Actions sur GitHub
  workflow_dispatch:
    inputs:
      seasons:
        description: "Saisons a tester (separees par des espaces)"
        required: false
        default: "2023 2024 2025"
      shrink_k:
        description: "Valeur(s) de shrink-k a tester, separees par des espaces (balayage si plusieurs)"
        required: false
        default: "8"
      home_advantage:
        description: "Facteur d'avantage du terrain pour le modele Poisson"
        required: false
        default: "1.15"

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Lancer le backtest
        env:
          FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
        run: |
          python backtest_ligue1.py \
            --seasons ${{ github.event.inputs.seasons || '2023 2024 2025' }} \
            --shrink-k ${{ github.event.inputs.shrink_k || '8' }} \
            --home-advantage ${{ github.event.inputs.home_advantage || '1.15' }}

      - name: Publier les resultats en telechargement
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: backtest_output/
          retention-days: 30
